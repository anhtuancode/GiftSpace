services:
  mysql:
    image: mysql:8.4
    container_name: giftspace_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: giftspace_db
      MYSQL_USER: giftspace_user
      MYSQL_PASSWORD: user_password_123
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local